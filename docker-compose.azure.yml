services:
  backend:
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      CLOUDX_RUNTIME_NETWORK: cloudx-internal
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/cloudx-github-app.pem
    volumes:
      - /home/azureuser/cloudx-github-app.pem:/run/secrets/cloudx-github-app.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cloudx-internal
      - docker-control

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudx-frontend
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      CLOUDX_BACKEND_URL: http://backend:8080
    networks:
      - cloudx-internal

  traefik:
    image: traefik:v3.7.17
    container_name: cloudx-traefik
    restart: unless-stopped
    depends_on:
      - frontend
    command:
      - --log.level=INFO
      - --accesslog=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme-x1.json
      - --certificatesresolvers.le.acme.preferredchain=ISRG Root X1
      - --certificatesresolvers.le.acme.profile=shortlived
      - --certificatesresolvers.le.acme.disablecommonname=true
      - --certificatesresolvers.le.acme.certificatesduration=160
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - cloudx-internal

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: cloudx-docker-socket-proxy
    restart: unless-stopped
    privileged: true
    environment:
      BUILD: "1"
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      POST: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-control

networks:
  cloudx-internal:
    internal: true
  docker-control:
    internal: true
