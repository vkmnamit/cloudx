http:
  routers:
    cloudx-frontend:
      rule: "Host(`172.198.131.112`)"
      entryPoints:
        - websecure
      service: cloudx-frontend
      tls:
        certResolver: le
        domains:
          - main: "172.198.131.112"

    cloudx-dashboard:
      rule: "Host(`cloudx.172.198.131.112.sslip.io`)"
      entryPoints:
        - websecure
      service: cloudx-frontend
      tls:
        certResolver: le

  services:
    cloudx-frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3000
