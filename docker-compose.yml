services:
  postgres:
    image: postgres:17
    container_name: cloudx-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudx

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: cloudx-backend

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    env_file:
      - ./backend/.env

volumes:
  postgres_data:
