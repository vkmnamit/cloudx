services:
  postgres:
    image: postgres:17
    container_name: cloudx-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudx

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: cloudx-backend

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    env_file:
      - ./backend/.env
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    networks:
      - default
      - docker-control

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: cloudx-docker-socket-proxy
    restart: unless-stopped
    privileged: true
    environment:
      BUILD: "1"
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      POST: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-control

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudx-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      CLOUDX_BACKEND_URL: http://backend:8080

volumes:
  postgres_data:

networks:
  docker-control:
    internal: true
